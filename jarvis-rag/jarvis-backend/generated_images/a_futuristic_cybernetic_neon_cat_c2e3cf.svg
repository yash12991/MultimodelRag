<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a0b2e" />
      <stop offset="50%" stop-color="#0b0614" />
      <stop offset="100%" stop-color="#020104" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseLaser" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="sharp" />
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for Body & Armor -->
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2c38" />
      <stop offset="50%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>

    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1b5c" />
      <stop offset="100%" stop-color="#180b29" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff7bce" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffee00" />
    </linearGradient>

    <!-- Cyberpunk Grid Pattern -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceIdSpace" patternTransform="perspective(500)">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ff007f" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>

    <!-- Hologram/Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGlow)" />

  <!-- Ambient Cyber City / Grid Background Elements -->
  <g opacity="0.4">
    <!-- Perspective Floor Grid -->
    <path d="M 0 750 L 1000 750" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 100 800 L 900 800" stroke="#ff007f" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 200 860 L 800 860" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 350 930 L 650 930" stroke="#ff007f" stroke-width="1" stroke-opacity="0.3" />
    
    <line x1="500" y1="650" x2="150" y2="1000" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="500" y1="650" x2="300" y2="1000" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="500" y1="650" x2="450" y2="1000" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="500" y1="650" x2="550" y2="1000" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="500" y1="650" x2="700" y2="1000" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="500" y1="650" x2="850" y2="1000" stroke="#ff007f" stroke-width="0.8" stroke-opacity="0.2" />
  </g>

  <!-- Giant Cyber Circle behind cat -->
  <circle cx="500" cy="450" r="320" fill="none" stroke="#1f113a" stroke-width="30" opacity="0.5"/>
  <circle cx="500" cy="450" r="300" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#pinkGlow)" opacity="0.7"/>
  <circle cx="500" cy="450" r="340" fill="none" stroke="url(#neonCyan)" stroke-width="1" stroke-dasharray="10 20 40 10" filter="url(#cyanGlow)" opacity="0.6"/>
  <circle cx="500" cy="450" r="260" fill="none" stroke="#ff9900" stroke-width="1" stroke-dasharray="5 15" opacity="0.4"/>

  <!-- BACK / SHOULDERS / TORSO -->
  <g id="cyber-torso">
    <!-- Outer shoulders -->
    <path d="M 280 850 L 320 620 L 420 580 L 500 600 L 580 580 L 680 620 L 720 850 Z" fill="url(#darkMetal)" stroke="#222" stroke-width="2" />
    
    <!-- Chest Plate -->
    <path d="M 360 850 L 400 670 L 500 700 L 600 670 L 640 850 Z" fill="url(#cyberPurple)" stroke="#3d1b5c" stroke-width="3" />
    
    <!-- Chest Core Reactor -->
    <circle cx="500" cy="760" r="45" fill="#0a0a0f" stroke="#ff007f" stroke-width="3" filter="url(#pinkGlow)" />
    <circle cx="500" cy="760" r="35" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="15 5" />
    <polygon points="500,730 525,760 500,790 475,760" fill="url(#neonCyan)" filter="url(#cyanGlow)" />
    <circle cx="500" cy="760" r="8" fill="#ffffff" filter="url(#cyanGlow)" />

    <!-- Collar / Neck Armor -->
    <path d="M 410 590 L 500 630 L 590 590 L 560 630 L 500 650 L 440 630 Z" fill="#1a1c26" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#cyanGlow)" />

    <!-- Shoulder Cybernetic Detailing -->
    <path d="M 320 620 L 360 640 L 330 700 Z" fill="#252836" stroke="#ff007f" stroke-width="1" />
    <path d="M 680 620 L 640 640 L 670 700 Z" fill="#252836" stroke="#ff007f" stroke-width="1" />
    <line x1="335" y1="650" x2="350" y2="670" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
    <line x1="665" y1="650" x2="650" y2="670" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
  </g>

  <!-- NECK & CABLES -->
  <g id="neck-cables">
    <path d="M 440 560 C 440 590, 460 610, 500 610 C 540 610, 560 590, 560 560" fill="none" stroke="#0f1015" stroke-width="30" />
    <!-- Neon tubing running down neck -->
    <path d="M 465 550 Q 470 590 480 620" fill="none" stroke="url(#neonPink)" stroke-width="4" filter="url(#pinkGlow)" />
    <path d="M 500 540 Q 500 590 500 630" fill="none" stroke="url(#neonCyan)" stroke-width="5" filter="url(#cyanGlow)" />
    <path d="M 535 550 Q 530 590 520 620" fill="none" stroke="url(#neonPink)" stroke-width="4" filter="url(#pinkGlow)" />
    <!-- Metallic vertebrae rings -->
    <rect x="460" y="555" width="80" height="6" rx="3" fill="#333" stroke="#666" stroke-width="1" />
    <rect x="455" y="575" width="90" height="6" rx="3" fill="#333" stroke="#666" stroke-width="1" />
    <rect x="450" y="595" width="100" height="6" rx="3" fill="#333" stroke="#666" stroke-width="1" />
  </g>

  <!-- HEAD STRUCTURE -->
  <g id="cyber-head">
    <!-- Base Head Shape (Sharp, angular cat skull) -->
    <polygon points="500,220 340,330 320,480 400,560 500,580 600,560 680,480 660,330" fill="url(#darkMetal)" stroke="#3f455b" stroke-width="3" />
    
    <!-- Cheek Armor Panels -->
    <path d="M 320 480 L 400 560 L 420 490 Z" fill="#1a1c24" stroke="#ff007f" stroke-width="1.5" />
    <path d="M 680 480 L 600 560 L 580 490 Z" fill="#1a1c24" stroke="#ff007f" stroke-width="1.5" />

    <!-- Forehead Plate -->
    <path d="M 500,220 L 390,340 L 430,460 L 570,460 L 610,340 Z" fill="#1c1e28" stroke="#00f2fe" stroke-width="1" />
    <path d="M 500 250 L 435 340 L 500 420 L 565 340 Z" fill="#111318" stroke="#333" stroke-width="2" />
    
    <!-- Center Forehead Cyber Glyph -->
    <line x1="500" y1="265" x2="500" y2="350" stroke="url(#neonPink)" stroke-width="3" filter="url(#pinkGlow)" />
    <circle cx="500" cy="380" r="6" fill="url(#neonCyan)" filter="url(#cyanGlow)" />

    <!-- EARS -->
    <!-- Left Ear -->
    <g id="left-ear">
      <polygon points="340,330 240,160 360,250" fill="url(#darkMetal)" stroke="#3f455b" stroke-width="3" />
      <polygon points="330,310 270,190 345,250" fill="#0d0e12" stroke="#ff007f" stroke-width="2" filter="url(#pinkGlow)" />
      <!-- Inner ear tech grid -->
      <line x1="300" y1="230" x2="320" y2="280" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
      <line x1="290" y1="210" x2="310" y2="240" stroke="#00f2fe" stroke-width="1" />
      <!-- Ear tip sensor -->
      <circle cx="240" cy="160" r="5" fill="#ff9900" filter="url(#goldGlow)" />
    </g>

    <!-- Right Ear -->
    <g id="right-ear">
      <polygon points="660,330 760,160 640,250" fill="url(#darkMetal)" stroke="#3f455b" stroke-width="3" />
      <polygon points="670,310 730,190 655,250" fill="#0d0e12" stroke="#ff007f" stroke-width="2" filter="url(#pinkGlow)" />
      <!-- Inner ear tech grid -->
      <line x1="700" y1="230" x2="680" y2="280" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
      <line x1="710" y1="210" x2="690" y2="240" stroke="#00f2fe" stroke-width="1" />
      <!-- Ear tip sensor -->
      <circle cx="760" cy="160" r="5" fill="#ff9900" filter="url(#goldGlow)" />
    </g>

    <!-- HOLOGRAPHIC CROWN / HEADSET -->
    <path d="M 320 280 Q 500 180 680 280" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#cyanGlow)" />
    <path d="M 400 230 Q 500 160 600 230" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#pinkGlow)" />
    <circle cx="500" cy="180" r="8" fill="#ffffff" filter="url(#cyanGlow)" />

    <!-- SENSORS / BROWS -->
    <path d="M 380 370 Q 440 350 470 380" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />
    <path d="M 620 370 Q 560 350 530 380" fill="none" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />

    <!-- EYES (Fierce Cyber Visor / Glowing Optics) -->
    <g id="eyes" filter="url(#intenseLaser)">
      <!-- Left Eye Outer Frame -->
      <polygon points="370,410 460,400 440,435 380,435" fill="#000" stroke="#ff007f" stroke-width="2" />
      <!-- Left Eye Neon Element -->
      <polygon points="380,413 450,405 435,430 390,430" fill="url(#neonCyan)" />
      <polygon points="410,410 425,408 420,432 405,432" fill="#ffffff" />

      <!-- Right Eye Outer Frame -->
      <polygon points="630,410 540,400 560,435 620,435" fill="#000" stroke="#ff007f" stroke-width="2" />
      <!-- Right Eye Neon Element -->
      <polygon points="620,413 550,405 565,430 610,430" fill="url(#neonCyan)" />
      <polygon points="590,410 575,408 580,432 595,432" fill="#ffffff" />
      
      <!-- Visor Connect Line (Laser Bridge) -->
      <line x1="460" y1="415" x2="540" y2="415" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="4 2" />
    </g>

    <!-- NOSE & MUZZLE -->
    <g id="muzzle">
      <!-- Upper Nose Bridge -->
      <polygon points="490,435 510,435 515,485 485,485" fill="#151720" stroke="#333" stroke-width="1" />
      
      <!-- Cyber Nose (Glowing Inverted Triangle) -->
      <polygon points="500,500 482,475 518,475" fill="url(#neonPink)" filter="url(#pinkGlow)" />
      <polygon points="500,488 490,478 510,478" fill="#ffffff" />

      <!-- Philtrum / Center Line -->
      <line x1="500" y1="500" x2="500" y2="535" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />

      <!-- Cybernetic Mouth / Jaw Plates -->
      <path d="M 450 535 Q 500 550 550 535" fill="none" stroke="#ff007f" stroke-width="3" filter="url(#pinkGlow)" />
      <path d="M 430 515 L 450 535 L 430 555" fill="none" stroke="#00f2fe" stroke-width="1.5" />
      <path d="M 570 515 L 550 535 L 570 555" fill="none" stroke="#00f2fe" stroke-width="1.5" />

      <!-- Cheek Vents / Data Ports -->
      <g stroke="#00f2fe" stroke-width="1.5" opacity="0.8">
        <line x1="370" y1="470" x2="410" y2="465" />
        <line x1="375" y1="480" x2="415" y2="475" />
        <line x1="380" y1="490" x2="420" y2="485" />

        <line x1="630" y1="470" x2="590" y2="465" />
        <line x1="625" y1="480" x2="585" y2="475" />
        <line x1="620" y1="490" x2="580" y2="485" />
      </g>
    </g>

    <!-- CYBERNETIC WHISKERS (Glowing Laser Filaments) -->
    <g id="whiskers" filter="url(#cyanGlow)">
      <!-- Left Whiskers -->
      <path d="M 420 500 Q 300 490 180 470" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" />
      <path d="M 425 515 Q 295 520 170 525" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" />
      <path d="M 420 530 Q 300 550 180 580" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-linecap="round" />

      <!-- Right Whiskers -->
      <path d="M 580 500 Q 700 490 820 470" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" />
      <path d="M 575 515 Q 705 520 830 525" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-linecap="round" />
      <path d="M 580 530 Q 700 550 820 580" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-linecap="round" />

      <!-- Whisker Node Base Dots -->
      <circle cx="420" cy="500" r="3" fill="#ff007f" />
      <circle cx="425" cy="515" r="3" fill="#ff007f" />
      <circle cx="420" cy="530" r="3" fill="#ff007f" />
      <circle cx="580" cy="500" r="3" fill="#ff007f" />
      <circle cx="575" cy="515" r="3" fill="#ff007f" />
      <circle cx="580" cy="530" r="3" fill="#ff007f" />
    </g>
  </g>

  <!-- FOREGROUND HOLOGRAPHIC UI & FLOATING DATA NODES -->
  <g id="hud-elements" opacity="0.85">
    <!-- Crosshairs & Target Rings -->
    <g transform="translate(500, 420)">
      <circle cx="0" cy="0" r="180" fill="none" stroke="#ff007f" stroke-width="0.75" stroke-dasharray="2 10 30 5" opacity="0.4" />
      <circle cx="0" cy="0" r="220" fill="none" stroke="#00f2fe" stroke-width="0.5" stroke-dasharray="80 150" opacity="0.5" />
      
      <!-- Target Brackets -->
      <path d="M -210 -150 L -210 -210 L -150 -210" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
      <path d="M 210 -150 L 210 -210 L 150 -210" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
      <path d="M -210 150 L -210 210 L -150 210" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
      <path d="M 210 150 L 210 210 L 150 210" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#cyanGlow)" />
    </g>

    <!-- Floating Hexagons / Tech Decals -->
    <polygon points="250,300 270,285 290,300 290,330 270,345 250,330" fill="none" stroke="url(#neonPink)" stroke-width="1.5" filter="url(#pinkGlow)" />
    <text x="260" y="360" fill="#00f2fe" font-family="monospace" font-size="12" letter-spacing="2">SYS.AI_v9</text>
    
    <polygon points="750,300 730,285 710,300 710,330 730,345 750,330" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#cyanGlow)" />
    <text x="690" y="360" fill="#ff007f" font-family="monospace" font-size="12" letter-spacing="2">NEURAL_LNK</text>

    <!-- Floating Data Stream Bars (Left) -->
    <g transform="translate(100, 450)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#00f2fe" stroke-width="3" filter="url(#cyanGlow)" />
      <line x1="0" y1="10" x2="50" y2="10" stroke="#ff007f" stroke-width="2" />
      <line x1="0" y1="20" x2="65" y2="20" stroke="#00f2fe" stroke-width="1" />
      <rect x="0" y="30" width="40" height="4" fill="#ff9900" />
      <rect x="45" y="30" width="10" height="4" fill="#00f2fe" />
    </g>

    <!-- Floating Data Stream Bars (Right) -->
    <g transform="translate(820, 450)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#00f2fe" stroke-width="3" filter="url(#cyanGlow)" />
      <line x1="30" y1="10" x2="80" y2="10" stroke="#ff007f" stroke-width="2" />
      <line x1="15" y1="20" x2="80" y2="20" stroke="#00f2fe" stroke-width="1" />
      <rect x="40" y="30" width="40" height="4" fill="#ff9900" />
      <rect x="25" y="30" width="10" height="4" fill="#00f2fe" />
    </g>
  </g>

  <!-- FOREGROUND ATMOSPHERIC PARTICLES & GLOWS -->
  <g id="floating-sparks" filter="url(#goldGlow)">
    <circle cx="350" cy="200" r="3" fill="#ffee00" />
    <circle cx="680" cy="180" r="2" fill="#00f2fe" />
    <circle cx="200" cy="350" r="2.5" fill="#ff007f" />
    <circle cx="850" cy="320" r="3" fill="#ffee00" />
    <circle cx="280" cy="650" r="2" fill="#00f2fe" />
    <circle cx="750" cy="680" r="3.5" fill="#ff007f" />
    <circle cx="500" cy="120" r="2" fill="#ffee00" />
  </g>

  <!-- VIGNETTE / SCANLINE OVERLAY -->
  <rect width="1000" height="1000" fill="url(#scanlines)" pointer-events="none" opacity="0.6" />
  
  <!-- Edge Vignette -->
  <rect width="1000" height="1000" fill="none" stroke="#000000" stroke-width="40" opacity="0.8" pointer-events="none" />
</svg>