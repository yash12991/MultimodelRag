<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
 <defs>
 <!-- Background Gradient -->
 <linearGradient id="marsSky" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#2a0800" />
 <stop offset="40%" stop-color="#661c0e" />
 <stop offset="70%" stop-color="#b83b1b" />
 <stop offset="100% " stop-color="#e27b42" />
 </linearGradient>

 <!-- Dune Gradients -->
 <linearGradient id="duneBack" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#8c2b12" />
 <stop offset="100%" stop-color="#cb5328" />
 </linearGradient>
 <linearGradient id="duneMid" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#ab3717" />
 <stop offset="100%" stop-color="#e86b35" />
 </linearGradient>
 <linearGradient id="duneFront" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#cd481d" />
 <stop offset="100%" stop-color="#f48c4a" />
 </linearGradient>

 <!-- Helmet Visor Gradient -->
 <radialGradient id="visorGlow" cx="40%" cy="30%" r="60%">
 <stop offset="0%" stop-color="#ffe600" />
 <stop offset="35%" stop-color="#ff7b00" />
 <stop offset="70%" stop-color="#8a1c00" />
 <stop offset="100%" stop-color="#200500" />
 </radialGradient>

 <!-- Glow Filter -->
 <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
 <feGaussianBlur stdDeviation="8" result="blur" />
 <feComposite in="SourceGraphic" in2="blur" operator="over" />
 </filter>
 </defs>

 <!-- Sky Canvas -->
 <rect width="1200" height="800" fill="url(#marsSky)" />

 <!-- Stars & Tiny Deimos/Phobos -->
 <g fill="#ffffff" opacity="0.6">
 <circle cx="150" cy="80" r="1.5" />
 <circle cx="340" cy="120" r="1" />
 <circle cx="680" cy="70" r="2" />
 <circle cx="950" cy="110" r="1" />
 <circle cx="1080" cy="150" r="1.5" />
 <circle cx="220" cy="200" r="1" />
 </g>
 <!-- Phobos Moon -->
 <circle cx="850" cy="140" r="12" fill="#d1b29f" opacity="0.8" filter="url(#glow)" />
 <circle cx="846" cy="136" r="4" fill="#a07d67" opacity="0.6" />

 <!-- Distant Sun -->
 <circle cx="450" cy="260" r="35" fill="#ffca7a" opacity="0.9" filter="url(#glow)" />
 <circle cx="450" cy="260" r="50" fill="#ff7b00" opacity="0.3" filter="url(#glow)" />

 <!-- Background Terrain / Mountains -->
 <path d="M0 480 Q 200 420, 450 460 T 900 440 Q 1050 430, 1200 470 L 1200 800 L 0 800 Z" fill="url(#duneBack)" />

 <!-- Midground Dunes -->
 <path d="M0 550 Q 350 480, 700 540 T 1200 520 L 1200 800 L 0 800 Z" fill="url(#duneMid)" />

 <!-- Foreground Dunes -->
 <path d="M0 650 Q 300 590, 650 640 Q 950 680, 1200 630 L 1200 800 L 0 800 Z" fill="url(#duneFront)" />

 <!-- Astronaut Group (Positioned Center-Left) -->
 <g transform="translate(480, 320)">
 <!-- Shadow on Ground -->
 <ellipse cx="60" cy="350" rx="140" ry="25" fill="#140200" opacity="0.7" />

 <!-- Backpack / Life Support -->
 <rect x="-15" y="80" rel="" width="60" height="90" rx="15" fill="#dcdcdc" stroke="#b0b0b0" stroke-width="3" />
 <rect x="-5" y="100" width="40" height="50" rx="8" fill="#333333" />
 <line x1="15" y1="170" x2="35" y2="240" stroke="#a0a0a0" stroke-width="8" stroke-linecap="round" />

 <!-- Suit Torso -->
 <path d="M -20 90 Q 40 70, 90 90 L 110 180 Q 35 210, -30 180 Z" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="3" />
 <!-- Chest Control Panel -->
 <rect x="25" y="110" width="35" height="25" rx="5" fill="#2b2b2b" stroke="#00ffff" stroke-width="1.5" />
 <circle cx="38" cy="122" r="4" fill="#ff3333" />
 <circle cx="50" cy="122" r="4" fill="#33ff66" />

 <!-- Arms -->
 <!-- Left Arm (Reaching out slightly toward horizon) -->
 <path d="M -15 95 Q -60 110, -90 140 Q -105 155, -95 165" fill="none" stroke="#f0f0f0" stroke-width="22" stroke-linecap="round" />
 <circle cx="-95" cy="165" r="12" fill="#c0c0c0" />

 <!-- Right Arm (Relaxed) -->
 <path d="M 85 95 Q 120 130, 110 180" fill="none" stroke="#f0f0f0" stroke-width="22" stroke-linecap="round" />
 <circle cx="110" cy="180" r="12" fill="#c0c0c0" />

 <!-- Legs -->
 <path d="M 0 190 Q -25 270, -35 320" fill="none" stroke="#e0e0e0" stroke-width="26" stroke-linecap="round" />
 <path d="M 60 190 Q 80 260, 95 310" fill="none" stroke="#e0e0e0" stroke-width="26" stroke-linecap="round" />
 <!-- Boots -->
 <ellipse cx="-40" cy="325" rx="22" ry="12" fill="#b0b0b0" />
 <ellipse cx="102" cy="315" rx="22" ry="12" fill="#b0b0b0" />

 <!-- Helmet & Head -->
 <circle cx="35" cy="40" r="42" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="3" />
 <!-- Golden Visor -->
 <circle cx="42" cy="40" r="32" fill="url(#visorGlow)" />
 <!-- Visor Reflection Highlight -->
 <path d="M 25 22 Q 40 18, 55 25 Q 40 32, 25 22 Z" fill="#ffffff" opacity="0.6" />
 <!-- Helmet Collar -->
 <path d="M -5 70 Q 35 85, 75 70 L 65 95 Q 35 105, 5 95 Z" fill="#b0b0b0" />
 </g>

 <!-- Atmospheric Dust & Particle Overlay -->
 <g fill="#ff9966" opacity="0.3">
 <circle cx="200" cy="500" r="3" />
 <circle cx="350" cy="620" r="2" />
 <circle cx="750" cy="580" r="4" />
 <circle cx="920" cy="480" r="2.5" />
 <circle cx="1100" cy="670" r="3" />
 </g>
</svg>