<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
 <defs>
 <!-- Background Gradient -->
 <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#02040a"/>
 <stop offset="50%" stop-color="#07111e"/>
 <stop offset="100%" stop-color="#0b1d33"/>
 </linearGradient>

 <!-- Bioluminescent Glow Filters -->
 <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
 <feGaussianBlur stdDeviation="12" result="blur1"/>
 <feGaussianBlur stdDeviation="24" result="blur2"/>
 <feMerge>
 <feMergeNode in="blur2"/>
 <feMergeNode in="blur1"/>
 <feMergeNode in="SourceGraphic"/>
 </feMerge>
 </filter>

 <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
 <feGaussianBlur stdDeviation="6" result="blur"/>
 <feMerge>
 <feMergeNode in="blur"/>
 <feMergeNode in="SourceGraphic"/>
 </feMerge>
 </filter>

 <!-- Flora Gradients -->
 <linearGradient id="tree-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#061322"/>
 <stop offset="100%" stop-color="#02070d"/>
 </linearGradient>

 <linearGradient id="tree-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#0d233a"/>
 <stop offset="100%" stop-color="#040b14"/>
 </linearGradient>

 <!-- Wolf Fur & Energy Gradients -->
 <linearGradient id="wolf-body" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" stop-color="#cbe6ff"/>
 <stop offset="40%" stop-color="#72b3ee"/>
 <stop offset="100%" stop-color="#194c7d"/>
 </linearGradient>

 <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
 <stop offset="0%" stop-color="#00f2fe"/>
 <stop offset="100%" stop-color="#4facfe"/>
 </linearGradient>

 <linearGradient id="violet-glow" x1="0%" y1="0%" x2="0%" y2="100%">
 <stop offset="0%" stop-color="#b19fff"/>
 <stop offset="100%" stop-color="#7000ff"/>
 </linearGradient>

 <!-- Glowing Spores -->
 <radialGradient id="spore-glow" cx="50%" cy="50%" r="50%">
 <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
 <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.8"/>
 <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
 </radialGradient>
 </defs>

 <!-- Deep Night Sky & Background -->
 <rect width="1200" height="800" fill="url(#bg-grad)"/>

 <!-- Mystic Moonlight Rays -->
 <g opacity="0.15">
 <polygon points="400,0 300,800 650,800" fill="url(#cyan-glow)"/>
 <polygon points="450,0 600,800 850,800" fill="url(#cyan-glow)"/>
 </g>

 <!-- Distant Glowing Forest Canopy & Mountains -->
 <path d="M0 600 L0 450 Q150 400 300 480 T600 420 T900 470 T1200 430 L1200 800 L0 800 Z" fill="url(#tree-grad-1)"/>

 <!-- Midground Bioluminescent Trees -->
 <g fill="url(#tree-grad-2)">
 <!-- Tree Left -->
 <path d="M-50 800 L30 200 L80 220 L150 800 Z"/>
 <path d="M80 800 L140 280 L180 300 L250 800 Z"/>
 <!-- Tree Right -->
 <path d="M1250 800 L1120 180 L1070 210 L1000 800 Z"/>
 <path d="M1050 800 L970 260 L930 290 L880 800 Z"/>
 </g>

 <!-- Glowing Roots and Ground Flora -->
 <g filter="url(#soft-glow)">
 <path d="M0 720 Q 300 680 600 710 T 1200 700 L 1200 800 L 0 800 Z" fill="#040a12"/>
 <!-- Glowing Root Tendrils -->
 <path d="M150 740 Q220 710 320 750" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.7"/>
 <path d="M850 730 Q940 700 1020 760" stroke="#b19fff" stroke-width="2.5" fill="none" opacity="0.7"/>
 <path d="M480 720 Q560 690 640 730" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.8"/>
 </g>

 <!-- Bioluminescent Mushrooms & Flowers -->
 <g filter="url(#neon-glow)">
 <!-- Mushroom Cluster Left -->
 <ellipse cx="220" cy="730" rx="18" ry="8" fill="#00f2fe"/>
 <path d="M220 738 L220 765" stroke="#00f2fe" stroke-width="4"/>
 <ellipse cx="250" cy="745" rx="12" ry="6" fill="#b19fff"/>
 <path d="M250 751 L250 775" stroke="#b19fff" stroke-width="3"/>
 
 <!-- Mushroom Cluster Right -->
 <ellipse cx="980" cy="715" rx="22" ry="10" fill="#b19fff"/>
 <path d="M980 725 L980 760" stroke="#b19fff" stroke-width="4"/>
 <ellipse cx="1020" cy="730" rx="15" ry="7" fill="#00f2fe"/>
 <path d="M1020 737 L1020 770" stroke="#00f2fe" stroke-width="3"/>
 </g>

 <!-- Floating Bioluminescent Spores -->
 <g filter="url(#neon-glow)">
 <circle cx="350" cy="500" r="4" fill="#00f2fe"/>
 <circle cx="380" cy="460" r="2" fill="#ffffff"/>
 <circle cx="280" cy="550" r="3" fill="#b19fff"/>
 <circle cx="450" cy="420" r="5" fill="#00f2fe"/>
 <circle cx="750" cy="400" r="3.5" fill="#b19fff"/>
 <circle cx="820" cy="480" r="2" fill="#ffffff"/>
 <circle cx="880" cy="430" r="4" fill="#00f2fe"/>
 <circle cx="680" cy="350" r="6" fill="#00f2fe"/>
 <circle cx="550" cy="300" r="3" fill="#b19fff"/>
 </g>

 <!-- MAJESTIC GLOWING WOLF -->
 <g transform="translate(320, 180)">
 <!-- Wolf Body Aura / Outer Glow -->
 <path d="M220 320 C180 320 120 340 90 380 C60 420 50 480 80 520 C110 560 180 570 240 560 C320 550 400 500 430 440 C460 380 440 330 380 320 C320 310 270 320 220 320 Z" fill="#00f2fe" opacity="0.25" filter="url(#neon-glow)"/>

 <!-- Wolf Hind Quarters & Tail -->
 <path d="M240 420 C200 420 150 440 120 480 C90 520 80 560 110 570 C140 580 190 540 260 490 Z" fill="url(#wolf-body)"/>
 <!-- Flowing Tail with Glowing Tip -->
 <path d="M110 570 C60 590 20 620 10 680 C30 650 70 610 120 580 Z" fill="url(#cyan-glow)" filter="url(#soft-glow)"/>

 <!-- Wolf Main Torso & Back -->
 <path d="M230 350 C280 340 340 380 380 430 C420 480 430 520 430 520 C430 520 350 530 270 510 C190 490 180 430 230 350 Z" fill="url(#wolf-body)"/>

 <!-- Wolf Chest & Forelegs -->
 <path d="M370 450 C410 470 450 510 460 560 C470 610 465 670 465 670 C465 670 450 670 440 630 C430 590 410 540 380 510 Z" fill="url(#wolf-body)"/>
 <path d="M290 470 C310 500 330 560 330 630 C330 670 320 670 320 670 C320 670 305 600 280 530 C265 490 280 470 290 470 Z" fill="url(#wolf-body)"/>

 <!-- Wolf Neck & Head -->
 <path d="M360 340 C380 300 400 260 430 220 C460 180 480 150 480 150 C480 150 490 200 470 250 C450 300 420 360 380 400 Z" fill="url(#wolf-body)"/>

 <!-- Wolf Head & Snout Structure -->
 <path d="M420 220 C450 200 480 170 510 140 C540 110 560 90 560 90 C560 90 540 140 500 180 C460 220 430 240 420 220 Z" fill="url(#wolf-body)"/>
 <path d="M480 150 C510 160 550 180 580 200 C610 220 630 240 630 240 C630 240 580 230 530 210 C480 190 470 170 480 150 Z" fill="url(#wolf-body)"/>

 <!-- Pointed Ears -->
 <!-- Left Ear -->
 <polygon points="410,240 380,160 430,200" fill="url(#wolf-body)"/>
 <polygon points="410,230 395,180 420,205" fill="#00f2fe" filter="url(#soft-glow)"/>
 <!-- Right Ear -->
 <polygon points="460,200 490,120 510,170" fill="url(#wolf-body)"/>
 <polygon points="470,190 485,140 500,165" fill="#00f2fe" filter="url(#soft-glow)"/>

 <!-- Glowing Mystic Eye -->
 <ellipse cx="510" cy="170" rx="6" ry="3" transform="rotate(-15 510 170)" fill="#ffffff" filter="url(#neon-glow)"/>

 <!-- Ethereal Energy Runes / Fur Markings on Body -->
 <g filter="url(#neon-glow)" stroke="url(#cyan-glow)" stroke-width="2.5" fill="none" stroke-linecap="round">
 <!-- Neck Runes -->
 <path d="M380 360 Q400 340 420 370"/>
 <path d="M395 390 Q420 370 440 410"/>
 <!-- Body Constellation Lines -->
 <path d="M260 450 L310 420 L360 460 L330 500 Z"/>
 <circle cx="310" cy="420" r="3" fill="#ffffff"/>
 <circle cx="360" cy="460" r="3" fill="#ffffff"/>
 <circle cx="330" cy="500" r="3" fill="#ffffff"/>
 <path d="M310 420 L280 390"/>
 <path d="M360 460 L410 440"/>
 </g>

 <!-- Glowing Breath / Mist from Snout -->
 <path d="M630 240 Q670 250 710 230 Q750 210 780 250" stroke="#00f2fe" stroke-width="4" fill="none" opacity="0.6" filter="url(#neon-glow)"/>
 </g>

 <!-- Foreground Atmospheric Lighting / Vignette -->
 <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
 <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
 <stop offset="100%" stop-color="#02040a" stop-opacity="0.85"/>
 </radialGradient>
 <rect width="1200" height="800" fill="url(#vignette)" pointer-events="none"/>
</svg>