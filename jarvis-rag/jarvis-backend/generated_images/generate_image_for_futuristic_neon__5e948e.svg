<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#15122e" />
      <stop offset="50%" stop-color="#0a0818" />
      <stop offset="100%" stop-color="#020106" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feGaussianBlur stdDeviation="30" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Saber Glow -->
    <filter id="saber-intense" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feGaussianBlur stdDeviation="25" result="blur3" />
      <feGaussianBlur stdDeviation="45" result="blur4" />
      <feMerge>
        <feMergeNode in="blur4" />
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Ambient Glow -->
    <filter id="ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <!-- Gradients for Armor and Elements -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#7a00ff" />
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="100%" stop-color="#ff6600" />
    </linearGradient>

    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3e5c" />
      <stop offset="50%" stop-color="#1d2033" />
      <stop offset="100%" stop-color="#0d0f1a" />
    </linearGradient>
    
    <linearGradient id="metal-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a99ad" />
      <stop offset="50%" stop-color="#414a63" />
      <stop offset="100%" stop-color="#212636" />
    </linearGradient>

    <!-- Raindrop Pattern -->
    <pattern id="rain" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="10" y1="0" x2="5" y2="35" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.6" />
      <line x1="45" y1="20" x2="40" y2="55" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4" />
      <line x1="30" y1="10" x2="26" y2="30" stroke="#ff0055" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <pattern id="heavy-rain" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <line x1="20" y1="0" x2="15" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg-grad)" />

  <!-- Neo-Tokyo City Skyline Silhouette & Holograms -->
  <g opacity="0.4">
    <!-- Distant Towers -->
    <rect x="50" y="300" width="80" height="700" fill="#0b0d19" />
    <polygon points="50,300 90,200 130,300" fill="#0b0d19" />
    <rect x="150" y="250" width="100" height="750" fill="#070912" />
    <rect x="750" y="200" width="120" height="800" fill="#070912" />
    <polygon points="750,200 810,120 870,200" fill="#070912" />
    <rect x="890" y="350" width="70" height="650" fill="#0b0d19" />

    <!-- Mid-ground Buildings -->
    <rect x="230" y="400" width="140" height="600" fill="#111425" />
    <rect x="620" y="350" width="150" height="650" fill="#111425" />
    
    <!-- Cyberpunk Architecture Details (Windows & Neon Strips) -->
    <g fill="#00f3ff" opacity="0.3">
      <rect x="170" y="300" width="10" height="400" />
      <rect x="210" y="450" width="15" height="200" />
      <rect x="780" y="300" width="10" height="500" />
      <rect x="820" y="250" width="8" height="300" />
    </g>
    <g fill="#ff0055" opacity="0.3">
      <rect x="260" y="500" width="40" height="10" />
      <rect x="260" y="530" width="40" height="10" />
      <rect x="650" y="400" width="60" height="8" />
      <rect x="670" y="450" width="30" height="8" />
    </g>

    <!-- Giant Holographic Kanji / Circle -->
    <circle cx="500" cy="300" r="180" fill="none" stroke="#ff0055" stroke-width="2" opacity="0.2" stroke-dasharray="10 15 30 5" />
    <circle cx="500" cy="300" r="150" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.15" />
    <path d="M420,300 L580,300 M500,220 L500,380" stroke="#00f3ff" stroke-width="2" opacity="0.2" />
  </g>

  <!-- Ambient Backlight / Torii Glow -->
  <circle cx="500" cy="450" r="250" fill="#ff0055" opacity="0.15" filter="url(#ambient-glow)" />
  <circle cx="450" cy="550" r="200" fill="#00f3ff" opacity="0.1" filter="url(#ambient-glow)" />

  <!-- Rain Layer (Back) -->
  <rect width="1000" height="1000" fill="url(#rain)" opacity="0.6" />

  <!-- SAMURAI CHARACTER -->
  <g transform="translate(0, 30)">
    
    <!-- Cape / Haori flowing in wind -->
    <path d="M 400,340 Q 320,400 280,550 Q 350,680 420,750 Q 390,550 430,420 Z" fill="#090a12" />
    <path d="M 400,340 Q 320,400 280,550 Q 350,680 420,750 Q 390,550 430,420 Z" fill="url(#magenta-glow)" opacity="0.2" />

    <!-- Lower Body / Hakama -->
    <path d="M 390,480 L 440,750 L 500,770 L 560,750 L 610,480 Z" fill="#121624" />
    <path d="M 475,480 L 485,760 L 515,760 L 525,480 Z" fill="#090b12" /> <!-- Center pleat shadow -->

    <!-- Cybernetic Torso & Armor -->
    <!-- Shoulder Guards (Sode) -->
    <g>
      <!-- Left Shoulder -->
      <path d="M 370,360 Q 330,370 310,410 L 330,460 Q 360,430 390,400 Z" fill="url(#metal-dark)" stroke="#00f3ff" stroke-width="1.5" />
      <path d="M 320,390 L 370,395" stroke="#00f3ff" stroke-width="2" filter="url(#neon-glow)" />
      
      <!-- Right Shoulder -->
      <path d="M 630,360 Q 670,370 690,410 L 670,460 Q 640,430 610,400 Z" fill="url(#metal-dark)" stroke="#ff0055" stroke-width="1.5" />
      <path d="M 680,390 L 630,395" stroke="#ff0055" stroke-width="2" filter="url(#neon-glow)" />
    </g>

    <!-- Chestplate (Do) -->
    <path d="M 400,350 L 600,350 L 620,470 L 500,500 L 380,470 Z" fill="url(#metal-light)" stroke="#2b334d" stroke-width="2" />
    
    <!-- Chest Core / Arc Reactor (Cyan) -->
    <polygon points="500,390 525,415 500,440 475,415" fill="#0a0e1a" stroke="#00f3ff" stroke-width="2" />
    <polygon points="500,400 515,415 500,430 485,415" fill="#00f3ff" filter="url(#neon-glow)" />
    <line x1="500" y1="350" x2="500" y2="390" stroke="#00f3ff" stroke-width="3" filter="url(#neon-glow)" />

    <!-- Armor Detailing - Ribs & Straps -->
    <path d="M 410,410 L 590,410 M 415,435 L 585,435 M 425,460 L 575,460" stroke="#00f3ff" stroke-width="1" opacity="0.7" />
    <path d="M 450,350 L 430,480 M 550,350 L 570,480" stroke="#ff0055" stroke-width="1.5" opacity="0.8" />

    <!-- Arms -->
    <!-- Left Arm (Holding Scabbard/Katana grip) -->
    <path d="M 370,360 L 330,440 L 360,460 L 390,390 Z" fill="url(#metal-dark)" />
    <path d="M 330,440 L 300,500 L 320,515 L 350,460" fill="url(#metal-light)" />
    <!-- Left Neon Arm Band -->
    <path d="M 312,475 L 335,490" stroke="#00f3ff" stroke-width="3" filter="url(#neon-glow)" />

    <!-- Right Arm (Raised, ready to draw) -->
    <path d="M 630,360 L 680,420 L 660,440 L 610,390 Z" fill="url(#metal-dark)" />
    <path d="M 680,420 L 720,380 L 740,400 L 660,440" fill="url(#metal-light)" />
    <path d="M 700,400 L 730,390" stroke="#ff0055" stroke-width="3" filter="url(#neon-glow)" />

    <!-- Neck & Collar High-Tech Techwear -->
    <path d="M 450,330 L 550,330 L 530,355 L 470,355 Z" fill="#1a1f33" stroke="#ff0055" stroke-width="1" />
    <circle cx="500" cy="342" r="4" fill="#ff0055" filter="url(#neon-glow)" />

    <!-- HEAD & KABUTO (Helmet) -->
    <g>
      <!-- Head Base / Mask (Mempo) -->
      <path d="M 450,230 L 550,230 L 565,300 L 530,330 L 470,330 L 435,300 Z" fill="url(#metal-dark)" />
      
      <!-- Glowing Visor / Eyes -->
      <path d="M 460,265 L 540,265 L 530,278 L 470,278 Z" fill="#00f3ff" filter="url(#neon-glow)" />
      <!-- Visor Split Line -->
      <line x1="500" y1="262" x2="500" y2="282" stroke="#0b0d19" stroke-width="2" />

      <!-- Face Mask Details (Cyber Oni) -->
      <path d="M 470,290 L 530,290 L 520,315 L 500,325 L 480,315 Z" fill="#141824" stroke="#ff0055" stroke-width="0.8" />
      <!-- Glowing Mouth Grille -->
      <line x1="485" y1="305" x2="515" y2="305" stroke="#ff0055" stroke-width="2" filter="url(#neon-glow)" />
      <line x1="492" y1="312" x2="508" y2="312" stroke="#ff0055" stroke-width="1.5" />

      <!-- Kabuto Dome -->
      <path d="M 440,230 Q 500,160 560,230 Z" fill="url(#metal-light)" stroke="#00f3ff" stroke-width="1" />
      <!-- Center Crest Ridge -->
      <path d="M 500,165 L 500,235" stroke="#00f3ff" stroke-width="3" filter="url(#neon-glow)" />

      <!-- Samurai Horns / Kuwagata -->
      <!-- Left Horn -->
      <path d="M 455,190 Q 400,140 370,110 L 390,105 Q 430,140 470,180 Z" fill="url(#gold-accent)" />
      <path d="M 455,190 Q 400,140 370,110" stroke="#ffcc00" stroke-width="1.5" filter="url(#neon-glow)" />

      <!-- Right Horn -->
      <path d="M 545,190 Q 600,140 630,110 L 610,105 Q 570,140 530,180 Z" fill="url(#gold-accent)" />
      <path d="M 545,190 Q 600,140 630,110" stroke="#ffcc00" stroke-width="1.5" filter="url(#neon-glow)" />

      <!-- Center Crest Emblem (Glowing Mon) -->
      <circle cx="500" cy="180" r="16" fill="#111" stroke="#ff0055" stroke-width="2" />
      <circle cx="500" cy="180" r="8" fill="#ff0055" filter="url(#neon-glow)" />

      <!-- Neck Guard (Shikoro - Plates) -->
      <path d="M 435,300 L 565,300 L 580,335 L 420,335 Z" fill="url(#metal-dark)" stroke="#2b334d" stroke-width="1" />
      <path d="M 425,312 L 575,312 M 422,324 L 578,324" stroke="#00f3ff" stroke-width="0.8" opacity="0.6" />
    </g>

    <!-- Katana & Scabbard (Saya) -->
    <!-- Scabbard angled across waist -->
    <path d="M 330,480 L 530,680 L 515,695 L 315,495 Z" fill="url(#metal-dark)" stroke="#00f3ff" stroke-width="1" />
    <line x1="330" y1="480" x2="520" y2="685" stroke="#00f3ff" stroke-width="2" filter="url(#neon-glow)" />

    <!-- THE GLOWING ENERGY KATANA (Drawn, pointing diagonally up-right with intense aura) -->
    <g>
      <!-- Energy Blade Core (Super Bright White/Pink) -->
      <line x1="380" y1="530" x2="780" y2="130" stroke="#ffffff" stroke-width="5" stroke-linecap="round" filter="url(#saber-intense)" />
      <!-- Energy Blade Outer Glow (Magenta/Cyan gradient effect via layered strokes) -->
      <line x1="380" y1="530" x2="780" y2="130" stroke="#ff00aa" stroke-width="12" stroke-linecap="round" filter="url(#saber-intense)" />
      <line x1="380" y1="530" x2="780" y2="130" stroke="#00f3ff" stroke-width="24" stroke-linecap="round" opacity="0.5" filter="url(#saber-intense)" />
      
      <!-- Katana Hilt (Tsuka) held in hand -->
      <path d="M 365,545 L 395,515" stroke="#111" stroke-width="12" stroke-linecap="round" />
      <!-- Tsuka Ito (Handle wrap) & Menuki -->
      <line x1="368" y1="542" x2="392" y2="518" stroke="#ff0055" stroke-width="4" stroke-dasharray="3 3" filter="url(#neon-glow)" />
      
      <!-- Tsuba (Hand Guard - Cybernetic Hexagon) -->
      <polygon points="380,530 390,520 400,530 395,540 385,540" fill="#222" stroke="#00f3ff" stroke-width="2" filter="url(#neon-glow)" />
      
      <!-- Energy Spark / Flare at tip -->
      <circle cx="780" cy="130" r="15" fill="#ffffff" filter="url(#neon-glow)" />
      <circle cx="780" cy="130" r="30" fill="#00f3ff" opacity="0.6" filter="url(#neon-glow)" />
    </g>

    <!-- Hands -->
    <!-- Left hand resting on scabbard -->
    <path d="M 440,580 Q 460,590 450,610 Q 440,615 430,600 Z" fill="url(#metal-light)" />
    <!-- Right hand gripping hilt -->
    <path d="M 375,540 Q 385,530 395,545 Q 390,555 375,540 Z" fill="url(#metal-light)" />
  </g>

  <!-- Rain Layer (Front - heavy, blurring foreground) -->
  <rect width="1000" height="1000" fill="url(#heavy-rain)" opacity="0.8" />

  <!-- Dramatic Cybernetic Lighting / Vignette Overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#020106" stop-opacity="0.85" />
  </radialGradient>
  <rect width="1000" height="1000" fill="url(#vignette)" style="mix-blend-mode: multiply;" />

  <!-- Bottom Fog / Ground Mist -->
  <ellipse cx="500" cy="950" rx="450" ry="80" fill="#0b0d1f" opacity="0.8" filter="url(#ambient-glow)" />
  <ellipse cx="500" cy="920" rx="300" ry="40" fill="#00f3ff" opacity="0.15" filter="url(#ambient-glow)" />
  <ellipse cx="500" cy="940" rx="200" ry="30" fill="#ff0055" opacity="0.1" filter="url(#ambient-glow)" />

  <!-- Floating Cyber Sparks / Embers in Wind -->
  <g filter="url(#neon-glow)">
    <circle cx="320" cy="400" r="2" fill="#00f3ff" />
    <circle cx="340" cy="380" r="1.5" fill="#00f3ff" />
    <circle cx="280" cy="450" r="2.5" fill="#00f3ff" />
    <circle cx="680" cy="280" r="2" fill="#ff0055" />
    <circle cx="720" cy="310" r="3" fill="#ff0055" />
    <circle cx="650" cy="220" r="1.5" fill="#ff0055" />
    <circle cx="550" cy="150" r="2" fill="#ffcc00" />
    <circle cx="430" cy="250" r="1.5" fill="#00f3ff" />
    <circle cx="600" cy="500" r="2" fill="#ff0055" />
    <circle cx="450" cy="650" r="2.5" fill="#00f3ff" />
    <circle cx="380" cy="750" r="1.5" fill="#ff0055" />
  </g>
</svg>